# The Canvas landing page, in one file. Edit this, run ./canvas.sh --push, and
# the course page is rebuilt. Everything in Canvas's rich-content editor is
# overwritten on each push, so this file is the only place the outline should
# be changed. Full reference: CANVAS.md (and course-kit's schedule.yml.template,
# which documents every key).
#
# Prose fields (preamble, topic, readings, note) are markdown, and may use:
#   {{site}}          the course site (site_url below)
#   {{notes}}         the notes book (notes_url below)
#   {{slides:DECK}}   a titled link to slides/DECK.qmd
#   {{file:NAME}}     a Canvas file, looked up by name
#
# NOTE: `lecture:` is the row-number key, never `n:` -- YAML 1.1 reads a bare
# `n` as the boolean "no".

canvas:
  host: https://utexas.instructure.com
  course_id: 000000                            # TODO: fill in -- from the course's Canvas URL
  page: welcome-to-temba-statistics            # TODO: fill in -- the course Front Page's slug

# One slug drives every generated name: the page's provenance marker, the API
# user agent, and the site-clone default in tools/lib/preamble.sh.
course_slug: temba2026

# This offering's own published site; {{site}} expands to it.
site_url: https://jaredsmurray.github.io/temba_stats

# The course notes book; {{notes}} expands to it.
notes_url: https://jaredsmurray.github.io/temba_stats/notes

# TODO: fill in -- Panopto folder linked under every date. A row may set its
# own `recording:` to override the folder link for that day.
# recordings: https://utexas.hosted.panopto.com/Panopto/Pages/Sessions/List.aspx?folderID=<folder-id>

preamble: |
  Welcome to TEMBA Statistics! Canvas will be your source for course materials
  and communication. Please communicate with us via Canvas message so we can
  prioritize you in our inboxes.

  **Instructor:** Jared Murray

  **Syllabus:** {{file:syllabus.pdf}}

  **Course notes:** [TEMBA Statistics — Course Notes]({{notes}})

  **Course outline:**

  Below is an outline of topics, readings, and related materials. This will be
  updated regularly.

columns: ["Date", "Readings", "Slides, code, and other materials"]

# Applied to every row unless the row sets its own. No `data:` key: with
# `data: auto` the generator would emit site links to datasets that are not
# published, and its pre-push check would refuse because they are not staged
# in _book/data. Add `data:` rows once the licensing adjudication is done.
defaults:
  materials:
    data: auto      # datasets derived from what each deck reads (data_manifest.yml)
    bundle: false

lectures:
  - lecture: 1
    date: TBD
    topic: "Visualizing a single variable"
    readings: |
      Lecture notes: [Chapter 1]({{notes}}/singlevar_01_visualizing-distributions.html) and [Chapter 2]({{notes}}/singlevar_02_describing-distributions.html)
    materials:
      slides: [01_basic_visualizations]
