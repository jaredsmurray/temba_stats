project:
  type: website
  output-dir: _book
  render:
    - "**/*.qmd"
    - "!notes/**"
    - "!data/**"
    - "!cards/**"   # data cards land at public/cards/ (fetch_data.sh), gitignored — never render
    - "!files/**"
  resources:
    - "files/*.pdf"
    - "files/*.zip"
    # Datasets served to students: only the files the imported notes/decks read.
    # Add entries as chapters/decks are imported (see data.qmd).
    - "data/austin_houses/austin_houses.csv"
    - "data/austin_houses/austin_houses_subset.csv"
    - "data/ercot/ercotproject/Data/load_1.csv"
    - "data/ercot/ercotproject/Data/load_2.csv"
    - "data/ercot/ercotproject/Data/load_3.csv"
    - "data/returns/returns.csv"
    - "data/returns/returns_prices.csv"
    - "data/mincer/cps_asec_2023.csv"
    - "data/lending_club/data/df_all.csv"
    - "data/lending_club/data/df_subs.csv"
    - "data/shed/shed_2025.csv"

website:
  title: "TEMBA Statistics"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: notes/index.html
        text: Notes
        target: _blank
      - href: slides.qmd
        text: Slides
      - href: data.qmd
        text: Data
      - href: introstatgpt.qmd
        text: IntroStatGPT
  sidebar:
    - title: "IntroStatGPT"
      style: docked
      contents:
        - introstatgpt.qmd
        - introstatgpt/setup.qmd
        - introstatgpt/use.qmd
        - introstatgpt/working.qmd

format:
  html:
    theme: cosmo

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
